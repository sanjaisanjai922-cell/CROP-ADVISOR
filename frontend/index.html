<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crop Advisor | Login</title><link rel="stylesheet" href="style.css?v=3"></head>
<body class="login-body">
<div class="login-shell">
  <div class="login-brand"><div class="logo">CA</div><div><h1>Crop Advisor</h1><p>Crop Disease Query & Advisory System</p></div></div>
  <div class="login-card">
    <div class="login-head"><span class="eyebrow">SECURE PORTAL</span><h2>Choose your portal</h2><p>Select a farmer or agricultural officer to continue.</p></div>
    <div class="role-tabs"><button class="role-tab active" data-role="farmer">👨‍🌾 Farmer Portal</button><button class="role-tab" data-role="officer">🧑‍💼 Officer Portal</button></div>
    <section id="farmerLogin" class="login-section">
      <label>Existing farmer<select id="farmerSelect"><option value="">Loading farmers...</option></select></label>
      <button class="btn primary wide" id="farmerLoginBtn">Login as Farmer →</button>
      <div class="divider"><span>NEW FARMER</span></div>
      <div class="form-grid"><label>Full name<input id="newFarmerName" placeholder="e.g. Arun Kumar"></label><label>Phone<input id="newFarmerPhone" placeholder="10-digit mobile"></label></div>
      <label>Region<select id="newFarmerRegion"><option value="">Loading regions...</option></select></label>
      <button class="btn secondary wide" id="registerFarmerBtn">Create Farmer Account</button>
      <p id="loginMessage" class="message"></p>
    </section>
    <section id="officerLogin" class="login-section hidden">
      <label>Select agricultural officer<select id="officerSelect"><option value="">Loading officers...</option></select></label>
      <button class="btn primary wide" id="officerLoginBtn">Open Officer Console →</button>
      <p class="hint">Officer accounts are selected from the officers already stored in MySQL.</p>
      <p id="officerMessage" class="message"></p>
    </section>
  </div>
  <div class="login-footer"><span>● Backend API</span><span>Spring Boot + MySQL</span><span>Role-based portals</span></div>
</div>
<script src="app.js?v=3"></script>
<script>window.addEventListener('DOMContentLoaded',()=>PortalUI.initLogin());</script>
</body></html>
